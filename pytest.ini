[pytest]
# swarm_dashboard_handoff_20260729/ is an archived snapshot, not live code.
# It ships its own copies of mavlink_manual_bridge.py, tracking_web.py and
# tracking_hybrid.py alongside four test files. Collecting those tests puts
# the archive on sys.path (pytest's default "prepend" import mode), after
# which every later `import mavlink_manual_bridge` in the run resolves to the
# 2026-07-29 copy instead of the real one -- which is why ~36 tests in
# test_offboard_authority, test_companion_peer_state,
# test_active_offboard_setpoint_sender and test_one_uav_active_readiness
# failed only in the full run and passed when run alone. Nothing was wrong
# with those tests or with the code they cover.
# `handoff/` is the same situation for stage2a_range_model: a duplicate test
# basename that pytest refuses to collect alongside the live one.
norecursedirs = swarm_dashboard_handoff_20260729 handoff artifacts .git __pycache__ node_modules .venv

# ROS's launch package registers a pytest plugin that cannot import `lark` on
# this machine, and an autoload failure aborts collection for the whole run
# before any test executes. Disabled by name rather than through
# PYTEST_DISABLE_PLUGIN_AUTOLOAD=1, which would also switch off the plugins
# the suite actually uses (pytest-subtests covers ~150 subtests here).
addopts = -p no:launch_testing -p no:launch_ros
